<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="鱼鱼画画：一条鱼和一枝画笔">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="brush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 底部水波 -->
  <path d="M7 53c7-5 13 3 20-1s12-6 19-2 8 2 11 0" fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>

  <!-- 鱼尾 -->
  <path d="M13 34 4 26l2.6 8L4 42z" fill="#fb923c"/>

  <!-- 鱼身 -->
  <path d="M12 34c4-7.5 12-11 19.5-11S46 28 46 34s-6.5 11-14.5 11S16 41.5 12 34Z" fill="url(#fish)"/>

  <!-- 背鳍 -->
  <path d="M25 23.2c1.4-5 6.6-6.4 9.6-3.4-1.9 1-3.6 1.6-5 3.2Z" fill="#fdba74"/>

  <!-- 眼睛 -->
  <circle cx="39.5" cy="31.6" r="2.5" fill="#ffffff"/>
  <circle cx="40" cy="31.6" r="1.2" fill="#0b1220"/>

  <!-- 身体高光 -->
  <path d="M17 33.5c2.4-3.5 6-5.4 10-5.8" fill="none" stroke="#fff7ed" stroke-opacity=".65" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 画笔：笔杆 → 金属箍 → 青色笔尖，正好点在鱼背上 -->
  <path d="M51 12.5 38.5 25" fill="none" stroke="url(#brush)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M38.5 25 35 28.5" fill="none" stroke="#94a3b8" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M35 28.5 31.5 32" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
  <circle cx="30.5" cy="33" r="2.1" fill="#2dd4bf" fill-opacity=".55"/>

  <!-- 小星光 -->
  <path d="M50 36.5v3.4M48.3 38.2h3.4" stroke="#fef3c7" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
</svg>
